<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Zombie Evac</title>
  <meta name="description" content="Zombie Evac - a real-time outbreak evacuation strategy game on real-world city maps. Rendered as a glowing CCTV feed.">
  <meta name="theme-color" content="#282828">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #282828; overflow: hidden; overscroll-behavior: none; }
    #game { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: crosshair;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #rotate { display: none; position: fixed; inset: 0; background: #282828; color: #d79921; align-items: center;
      justify-content: center; text-align: center; font: bold 20px "Noto Sans Mono", monospace; padding: 24px; }
    @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
    noscript { color: #a89984; font: bold 18px monospace; position: fixed; top: 40%; width: 100%; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Zombie Evac game"></canvas>
  <div id="rotate">ROTATE YOUR DEVICE<br>CCTV FEED NEEDS LANDSCAPE</div>
  <noscript>ZOMBIE EVAC NEEDS JAVASCRIPT</noscript>
  <script type="module">
    import { App } from "./js/app.js";
    import { Store } from "./js/store.js";
    const store = new Store();
    const app = new App(document.getElementById("game"), store);
    window.zombieEvac = app;
    app.init();
    store.init();
  </script>
</body>
</html>
